<body>
    <!-- 🌟 구글 로봇이 대문 역할을 인식할 영문 타이틀 -->
    <h1>Welcome to Global Smart Shopping Deals!</h1>
    
    <!-- 🌟 수정됨: 사이트맵을 읽어와 화면에 뿌려주는 영역 및 스크립트 추가 -->
    <div id="products-list">
        <p>Loading latest deals...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 사이트맵 파일을 불러옵니다
            fetch('/sitemap.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const urls = data.querySelectorAll("url loc");
                    const listContainer = document.getElementById("products-list");
                    let html = "<ul style='line-height: 1.8; font-size: 16px; list-style-type: none; padding-left: 0;'>";
                    
                    // 최신 글이 위로 오도록 배열을 뒤집음 (역순)
                    const urlArray = Array.from(urls).reverse();
                    
                    urlArray.forEach(urlNode => {
                        const loc = urlNode.textContent;
                        
                        // 메인 도메인 자체는 리스트에서 제외
                        if (loc === "https://shop3.torinori-shop.com" || loc === "https://shop3.torinori-shop.com/") return;
                        
                        // URL 경로에서 파일명만 추출하여 임시 제목으로 사용
                        let title = loc.split('/').pop().replace('.html', '').replace(/_/g, ' ');
                        if (!title) title = "Check out this deal!";
                        
                        // 로봇이 타고 들어갈 수 있는 a 태그(하이퍼링크) 생성
                        html += `<li style="margin-bottom: 10px;">
                                    <a href="${loc}" style="color: #0056b3; text-decoration: none; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 2px;">
                                        👉 [Deal] ${title}
                                    </a>
                                 </li>`;
                    });
                    
                    html += "</ul>";
                    listContainer.innerHTML = html; // 화면에 링크 출력
                })
                .catch(err => {
                    console.error("Error loading sitemap:", err);
                    document.getElementById("products-list").innerHTML = "<p>Products update in progress...</p>";
                });
        });
    </script>
</body>
</html>
