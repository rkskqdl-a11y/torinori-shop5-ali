<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🌟 구글 서치콘솔 5호점 미국 인증 태그 (기존 코드가 있다면 유지하세요) -->
    <!-- <meta name="google-site-verification" content="여기에구글코드" /> -->

    <title>Global Smart Shopping Deals | AliExpress Affiliate</title>
    
    <meta name="description" content="Discover daily updated best deals, hot items, and smart shopping guide from AliExpress. Find the lowest prices and honest product reviews here.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Global Smart Shopping Deals">
    <meta property="og:description" content="Find the best AliExpress deals updated daily. Grab your limited-time offers and smart shopping guide now.">
</head>
<body>
    <!-- 🌟 구글 로봇이 대문 역할을 인식할 영문 타이틀 -->
    <h1>Welcome to Global Smart Shopping Deals!</h1>
    
    <!-- n8n 자동화 로직이 매일 발행하는 상품 링크들이 이 아래에 차곡차곡 누적됩니다 -->
    <div id="products-list">
        <p style="color: #666; margin-top: 20px;">Loading latest deals...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/sitemap.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const urls = data.querySelectorAll("url loc");
                    const listContainer = document.getElementById("products-list");
                    let html = "<ul style='line-height: 1.8; font-size: 16px; list-style-type: none; padding-left: 0; margin-top: 20px;'>";
                    
                    const urlArray = Array.from(urls).reverse();
                    
                    urlArray.forEach(urlNode => {
                        const loc = urlNode.textContent;
                        
                        // 메인 도메인 자체는 제외
                        if (loc === "https://shop5.torinori-shop.com" || loc === "https://shop5.torinori-shop.com/") return;
                        
                        let title = loc.split('/').pop().replace('.html', '').replace(/_/g, ' ');
                        if (!title) title = "Check out this deal";
                        
                        // 🌟 영문 사이트에 맞게 텍스트 변경
                        html += `<li style="margin-bottom: 12px;">
                                    <a href="${loc}" style="color: #0056b3; text-decoration: none; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 2px;">
                                        👉 [Hot Deal] ${title}
                                    </a>
                                 </li>`;
                    });
                    
                    html += "</ul>";
                    listContainer.innerHTML = html;
                })
                .catch(err => {
                    console.error("Error loading sitemap:", err);
                    document.getElementById("products-list").innerHTML = "<p>Updating product list...</p>";
                });
        });
    </script>
</body>
</html>
